name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead. Screenshots help, but crop out session titles and anything else personal.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.5"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClaudeResume version
      placeholder: "1.0.0, or a commit hash if built from source"
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`. Transcript format changes between versions.
      placeholder: "2.1.296"
  - type: input
    id: iterm
    attributes:
      label: iTerm2 version
      placeholder: "3.6.11"
  - type: textarea
    id: error
    attributes:
      label: Error banner text
      description: If the panel shows an error, paste it here. Please don't paste transcript contents.
